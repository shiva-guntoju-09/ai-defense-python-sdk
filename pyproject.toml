[tool.poetry]
name = "cisco-aidefense-sdk"
version = "2.1.0"
description = "Cisco AI Defense Python SDK — Integrate AI-powered security, privacy, and safety inspections into your Python applications."
authors = ["Cisco AI Defense <ai-defense-oss@cisco.com>"]
maintainers = [
    "Shiva Guntoju <shguntoj@cisco.com>",
    "Ujjayant Sinha <ujsinha@cisco.com>",
    "Rajat Upadhyaya <rupadhy2@cisco.com>",
]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/cisco-ai-defense/ai-defense-python-sdk"
repository = "https://github.com/cisco-ai-defense/ai-defense-python-sdk"
documentation = "https://github.com/cisco-ai-defense/ai-defense-python-sdk#readme"
keywords = ["cisco", "ai-defense", "ai-security", "llm", "mcp", "agent-security", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{include = "aidefense"}]

[tool.poetry.dependencies]
aiohttp = "^3.13.2"
python = "^3.9"
requests = "^2.32.3"
uuid = "^1.30"
pydantic = "^2.12.5"
tenacity = "^9.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = ">=3.10.0"
pytest-httpx = ">=0.30.0"
black = "^24.3.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
